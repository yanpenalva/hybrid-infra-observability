# yamllint disable rule:document-start
# Dependabot requires the file to begin with "version: 2", so no document-start marker.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    # One entry for the three Dockerfiles that share debian:bookworm-slim, so a
    # base-image bump lands as a single pull request instead of three unrelated
    # ones, which is step 2 of the bump order in docs/image-bump.md.
    directories:
      - /ansible/app
      - /ansible/db
      - /ansible/control-node
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      docker-base-images:
        patterns: ["*"]
    commit-message:
      prefix: ci
