---
name: Static validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # This job never needs a cluster or personal secrets. Tool absence FAILS by
    # default. For an explicit reduced local run: HIO_REQUIRE_TOOLS=0 scripts/check.sh
    # emits SKIP per missing tool; such a run is NOT the full CI gate.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Python validators
        run: |
          python3 -m venv "$RUNNER_TEMP/validators"
          "$RUNNER_TEMP/validators/bin/pip" install \
            PyYAML==6.0.2 yamllint==1.35.1 \
            ansible-core==2.18.3 ansible-lint==25.1.3
          echo "$RUNNER_TEMP/validators/bin" >> "$GITHUB_PATH"
      - name: Install pinned Ansible collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Install pinned schema and monitoring validators
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/hio-bin"
          work="$RUNNER_TEMP/hio-downloads"
          mkdir -p "$bin" "$work"
          download() { curl --fail --silent --show-error --location "$1" -o "$2"; }
          download https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz "$work/kube.tgz"
          tar -xzf "$work/kube.tgz" -C "$bin" kubeconform
          download https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl "$bin/kubectl"
          download https://github.com/prometheus/prometheus/releases/download/v3.2.1/prometheus-3.2.1.linux-amd64.tar.gz "$work/prom.tgz"
          tar -xzf "$work/prom.tgz" -C "$work"
          cp "$work/prometheus-3.2.1.linux-amd64/promtool" "$bin/"
          download https://github.com/prometheus/alertmanager/releases/download/v0.28.1/alertmanager-0.28.1.linux-amd64.tar.gz "$work/am.tgz"
          tar -xzf "$work/am.tgz" -C "$work"
          cp "$work/alertmanager-0.28.1.linux-amd64/amtool" "$bin/"
          download https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz "$work/leaks.tgz"
          tar -xzf "$work/leaks.tgz" -C "$bin" gitleaks
          chmod +x "$bin/"*
          echo "$bin" >> "$GITHUB_PATH"
      - name: YAML, Ansible lint and syntax, schemas, rules, config, secrets
        env:
          HIO_REQUIRE_TOOLS: '1'
        run: bash scripts/check.sh
