# Interface: InstanceDown{job="managed-nodes",node,instance,severity="critical"}; HighCPUUsage same target labels, severity="warning".
# Interface: AppSLOBurnRateFast{job="demo-app",node="app",slo="availability|latency",severity="critical"}.
# Interface: AppSLOBurnRateSlow{job="demo-app",node="app",slo="availability|latency",severity="warning"}.
# Interface: AppDown / AppMetricsMissing{job="demo-app",node="app",severity="critical"}; no instance label.
# Contract: synthetic /health workload, 99% non-5xx and <=300ms over nominal 30d; /metrics and /chaos excluded.
---
groups:
  - name: managed-node-availability
    rules:
      - alert: InstanceDown
        expr: up{job="managed-nodes"} == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: Managed node exporter unavailable
      # Host/kernel exporter signal, NOT proof of per-container cgroup usage.
      - alert: HighCPUUsage
        expr: 100 * (1 - avg by (job, node, instance) (rate(node_cpu_seconds_total{job="managed-nodes",mode="idle"}[1m]))) > 80
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: Managed node CPU above 80 percent
  - name: demo-app-slo
    rules:
      # User's three-route contract supersedes the plan's fourth route (/).
      # Both SLOs use a 1% budget. Canonical long windows are not a short demo.
      - record: demo:slo_requests:rate5m
        expr: sum by (job, node) (rate(demo_http_requests_total{job="demo-app",route="/health"}[5m]))
      - record: demo:slo_requests:rate1h
        expr: sum by (job, node) (rate(demo_http_requests_total{job="demo-app",route="/health"}[1h]))
      - record: demo:slo_requests:rate30m
        expr: sum by (job, node) (rate(demo_http_requests_total{job="demo-app",route="/health"}[30m]))
      - record: demo:slo_requests:rate6h
        expr: sum by (job, node) (rate(demo_http_requests_total{job="demo-app",route="/health"}[6h]))
      - record: demo:slo_burn:rate5m
        labels: {slo: availability}
        expr: sum by (job, node) (rate(demo_http_requests_total{job="demo-app",route="/health",status_class="5xx"}[5m])) / clamp_min(demo:slo_requests:rate5m, 1e-9) / 0.01 and on (job, node) (demo:slo_requests:rate5m > 0)
      - record: demo:slo_burn:rate1h
        labels: {slo: availability}
        expr: sum by (job, node) (rate(demo_http_requests_total{job="demo-app",route="/health",status_class="5xx"}[1h])) / clamp_min(demo:slo_requests:rate1h, 1e-9) / 0.01 and on (job, node) (demo:slo_requests:rate1h > 0)
      - record: demo:slo_burn:rate30m
        labels: {slo: availability}
        expr: sum by (job, node) (rate(demo_http_requests_total{job="demo-app",route="/health",status_class="5xx"}[30m])) / clamp_min(demo:slo_requests:rate30m, 1e-9) / 0.01 and on (job, node) (demo:slo_requests:rate30m > 0)
      - record: demo:slo_burn:rate6h
        labels: {slo: availability}
        expr: sum by (job, node) (rate(demo_http_requests_total{job="demo-app",route="/health",status_class="5xx"}[6h])) / clamp_min(demo:slo_requests:rate6h, 1e-9) / 0.01 and on (job, node) (demo:slo_requests:rate6h > 0)
      - record: demo:slo_burn:rate5m
        labels: {slo: latency}
        expr: clamp_min(1 - sum by (job, node) (rate(demo_http_request_duration_seconds_bucket{job="demo-app",route="/health",le="0.3"}[5m])) / clamp_min(demo:slo_requests:rate5m, 1e-9), 0) / 0.01 and on (job, node) (demo:slo_requests:rate5m > 0)
      - record: demo:slo_burn:rate1h
        labels: {slo: latency}
        expr: clamp_min(1 - sum by (job, node) (rate(demo_http_request_duration_seconds_bucket{job="demo-app",route="/health",le="0.3"}[1h])) / clamp_min(demo:slo_requests:rate1h, 1e-9), 0) / 0.01 and on (job, node) (demo:slo_requests:rate1h > 0)
      - record: demo:slo_burn:rate30m
        labels: {slo: latency}
        expr: clamp_min(1 - sum by (job, node) (rate(demo_http_request_duration_seconds_bucket{job="demo-app",route="/health",le="0.3"}[30m])) / clamp_min(demo:slo_requests:rate30m, 1e-9), 0) / 0.01 and on (job, node) (demo:slo_requests:rate30m > 0)
      - record: demo:slo_burn:rate6h
        labels: {slo: latency}
        expr: clamp_min(1 - sum by (job, node) (rate(demo_http_request_duration_seconds_bucket{job="demo-app",route="/health",le="0.3"}[6h])) / clamp_min(demo:slo_requests:rate6h, 1e-9), 0) / 0.01 and on (job, node) (demo:slo_requests:rate6h > 0)
      # >=0.1 requests/s in BOTH windows; a lone failure cannot burn the SLO.
      - alert: AppSLOBurnRateFast
        expr: (demo:slo_burn:rate5m > 14.4 and demo:slo_burn:rate1h > 14.4) and on (job, node) (demo:slo_requests:rate5m >= 0.1 and demo:slo_requests:rate1h >= 0.1)
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: Synthetic app SLO fast burn (5m and 1h)
      - alert: AppSLOBurnRateSlow
        expr: (demo:slo_burn:rate30m > 6 and demo:slo_burn:rate6h > 6) and on (job, node) (demo:slo_requests:rate30m >= 0.1 and demo:slo_requests:rate6h >= 0.1)
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Synthetic app SLO slow burn (30m and 6h)
      - alert: AppDown
        expr: max by (job, node) (up{job="demo-app",node="app"}) == 0 or absent(up{job="demo-app",node="app"})
        for: 15s
        labels: {severity: critical}
        annotations:
          summary: Synthetic app scrape unavailable
      # No data/traffic is unknown, NEVER a claim of 100% availability.
      - alert: AppMetricsMissing
        expr: (sum by (job, node) (absent(demo_http_requests_total{job="demo-app",node="app",route="/health",status_class="2xx"}) or absent(demo_http_requests_total{job="demo-app",node="app",route="/health",status_class="5xx"}) or absent(demo_http_request_duration_seconds_bucket{job="demo-app",node="app",route="/health",le="0.3"})) > 0) or (sum by (job, node) (rate(demo_http_requests_total{job="demo-app",node="app",route="/health"}[5m])) == 0)
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: Synthetic app SLO data or traffic missing
