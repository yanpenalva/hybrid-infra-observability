---
name: hybrid-infra-observability
services:
  control-node:
    build:
      context: .
      dockerfile: control-node/Dockerfile
    hostname: control-node
    working_dir: /ansible
    init: true
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 128
    volumes:
      - ./control-node:/ansible:ro
      - ./keys/id_ed25519:/root/.ssh/id_ed25519:ro
      - ../.local/known_hosts:/root/.ssh/known_hosts:ro
    networks: [ansible-net]
    depends_on: [app, db]
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    hostname: app
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 128
    # Required: verified bridge interface, never an implicit all-interface bind.
    ports:
      - "${HIO_METRICS_BIND:?Set verified bridge address}:9101:9100"
      - "${HIO_METRICS_BIND:?Set verified bridge address}:8080:8080"
    volumes:
      - ./keys/id_ed25519.pub:/run/bootstrap/authorized_keys:ro
    networks: [ansible-net]
  db:
    build:
      context: .
      dockerfile: db/Dockerfile
    hostname: db
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 128
    ports: ["${HIO_METRICS_BIND:?Set verified bridge address}:9102:9100"]
    volumes:
      - ./keys/id_ed25519.pub:/run/bootstrap/authorized_keys:ro
    networks: [ansible-net]
networks:
  ansible-net:
    driver: bridge
