---
- name: Verify supervised exporter
  hosts: all
  become: true
  tasks:
    - name: Ensure image-provided exporter is installed
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present
    - name: Ensure supervised exporter is running
      community.general.supervisorctl:
        name: node_exporter
        state: started
    - name: Verify metrics endpoint
      ansible.builtin.uri:
        url: http://localhost:9100/metrics
        status_code: 200
      register: metrics_result
      until: metrics_result.status == 200
      retries: 10
      delay: 2
